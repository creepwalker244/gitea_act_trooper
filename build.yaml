name: Шаблон сборки

on:
  pull_request:
    types: [opened, synchronize]   # при открытии PR и новых коммитах в PR
    branches: [main]               # только main

env:
  IMAGE_NAME: ${{ secrets.IMAGE_ENV_NAME }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_ENV_NAME }}
  HOST_PORT: ${{ secrets.ENV_SERVICE_HOST_PORT }}
  CONTAINER_PORT: ${{ secrets.ENV_SERVICE_CONTAINER_PORT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование кода
        uses: actions/checkout@v4
      
      - name: Сборка Docker-образа
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ gitea.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
      
      - name: Сохранение имеджа в файл
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz
      
      - name: Передача имеджа в следующую джобу
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  deploy:
    needs: build                   
    runs-on: ubuntu-latest
    steps:
      - name: Скачать артефакт с образом
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Копирование образа на хост
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: image.tar.gz
          target: /tmp/
      
      - name: Деплой на удалённом хосте
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Загружаем образ
            docker load < /tmp/image.tar.gz
            
            # Останавливаем и удаляем старый контейнер (если есть)
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            
            # Запускаем новый контейнер
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              ${{ env.IMAGE_NAME }}:latest
            
            # Удаляем временный файл
            rm /tmp/image.tar.gz
            
            # Проверяем, что контейнер запущен
            sleep 3
            docker ps --filter name=${{ env.CONTAINER_NAME }} --format "table {{.Names}}\t{{.Status}}"
